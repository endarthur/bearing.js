name: Publish to npm

on:
  release:
    types: [published]

# Trusted publishing (OIDC) — no NPM_TOKEN. npm exchanges the workflow's
# short-lived OIDC token for a scoped publish credential, matched against the
# trusted-publisher config on npmjs.com (endarthur/bearing.js · publish.yml).
# Provenance is signed with the same id-token.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1 (node 22 ships npm 10)
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm publish --provenance --access public
